<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo promotion customer QA</title><link rel="stylesheet" href="../../web/promotion.css"><style>body{margin:0;background:#f2eae4}main{max-width:540px;margin:auto;background:#fff;min-height:100vh;padding:12px}h1{font:700 25px system-ui;color:#78535f}</style><main><h1>Demo Nails — ทดสอบเท่านั้น</h1><div id="lineLinkCard">เชื่อม LINE แล้ว (ข้อมูลจำลอง)</div><button id="fake-slip">จำลองแนบสลิปสำเร็จ</button></main><script>
const campaign={id:'test-campaign',title:'Secret Five · คิวลับสัปดาห์นี้',active:true,remaining:5,slots:[{id:'s1',date:'2099-01-05',start:'10:00:00',end:'12:30:00'}],attempt:null};let codes=[];
window.DemoData={isConfigured:()=>true,promotion:async(action)=>{if(action==='reserve'){campaign.attempt={id:'attempt1',status:'held',percent:10,expires_at:new Date(Date.now()+300000).toISOString(),booking_id:null};campaign.remaining=4;return campaign.attempt;}return {serverTime:new Date().toISOString(),linked:true,campaigns:[campaign],codes,credits:[]};}};
document.getElementById('fake-slip').onclick=()=>{campaign.attempt.status='confirmed';campaign.attempt.booking_id='b1';codes=[{code:'QA123456789ABCDE',status:'available',expires_at:'2099-02-05T00:00:00Z'}];PromotionUI.refresh(true)};
</script><script src="../../web/promotion-core.js"></script><script src="../../web/promotion-ui.js"></script></html>
