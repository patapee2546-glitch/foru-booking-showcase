<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>หลังบ้าน — เลือกประเภทรอบ (ทดสอบ)</title><link rel="stylesheet" href="../../web/promotion.css">
<style>body{margin:0;background:#f5f0eb;color:#6e625c;font-family:system-ui}main{max-width:900px;margin:auto;padding:24px;background:#fffcf8;min-height:100vh}h2{font-size:27px}#slotList{display:grid;gap:20px}.slot{width:100%;display:grid;grid-template-columns:1fr auto 18px;gap:18px;align-items:center;padding:28px;background:#fffefa;color:inherit;min-height:120px;cursor:pointer;text-align:left}.slot-time{font-weight:700;font-size:27px}.pill{border-radius:40px;padding:12px 25px;background:#eaf0e5;color:#7c8973;font-size:17px}.arrow{font-size:29px;color:#c9b3a6}@media(max-width:480px){main{padding:16px}.slot{padding:22px 16px;gap:10px}.slot-time{font-size:22px}.pill{padding:10px 15px;font-size:14px}}</style>
<div id="merchantApp"><main><h2>จัดการช่วงเวลารับจอง</h2><p>ข้อมูลจำลอง ไม่เปลี่ยนคิวจริง</p><div id="slotList"></div></main></div>
<script>
const types=new Set();
document.getElementById('slotList').innerHTML=[['10:00','12:30'],['13:30','16:00'],['17:00','19:30']].map(([start,end])=>`<section class="inline-promo-slot"><button class="slot"><span class="slot-time">${start}–${end}</span><span class="pill">เปิดรับ</span><span class="arrow">›</span></button><div class="inline-promo-controls"><label>ประเภทรอบ <select data-promo-inline-date="2099-02-02" data-promo-inline-start="${start}" aria-label="ประเภทรอบ ${start}–${end}" disabled><option value="normal">ธรรมดา</option><option value="special">♥ พิเศษ — โปรวงล้อ</option></select></label><span role="status" data-inline-promo-message></span></div></section>`).join('');
window.DemoData={isConfigured:()=>true,promotion:async(action,data)=>{if(action==='slot-type'){if(data.special)types.add(data.start);else types.delete(data.start);return {special:data.special};}return{serverTime:new Date().toISOString(),linked:true,campaigns:types.size?[{id:'fixture',title:'Demo Secret Five',active:true,remaining:5,slots:[...types].map(start=>({date:'2099-02-02',start,end:'22:30'}))}]:[],codes:[],credits:[]}}};
</script><script src="../../web/promotion-core.js"></script><script src="../../web/promotion-ui.js"></script></html>
