<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รอบพิเศษ — ทดสอบเท่านั้น</title><link rel="stylesheet" href="../../web/promotion.css">
<style>body{margin:0;background:#f5efea;font-family:system-ui;color:#665b56}main{max-width:500px;margin:auto;padding:20px;background:#fffaf7}.mobile-time-row{width:100%;display:flex;align-items:center;justify-content:space-between;padding:28px 20px;margin:18px 0;border:1px solid #e7d7ce;border-radius:22px;background:#fff;color:#665b56;text-align:left}.mobile-time{font-size:23px;font-weight:700}.mobile-status{padding:10px 20px;border-radius:30px;background:#dcebd5;color:#49613e;font-size:16px}.full{background:#f8e0e5;color:#ad4b60}</style>
<main><h2>รอบพิเศษ — ข้อมูลจำลอง</h2>
<button class="mobile-time-row" data-promo-slot-date="2099-01-05" data-promo-slot-time="10:00"><span class="mobile-time">10:00–12:30</span><span class="mobile-status">ว่าง</span></button>
<button class="mobile-time-row" disabled data-promo-slot-date="2099-01-05" data-promo-slot-time="13:30"><span class="mobile-time">13:30–16:00</span><span class="mobile-status full">เต็ม</span></button>
<button class="mobile-time-row" data-promo-slot-date="2099-01-05" data-promo-slot-time="17:00"><span class="mobile-time">17:00–19:30</span><span class="mobile-status">ว่าง</span></button>
<button id="close-campaign">จำลองปิดแคมเปญ กลับเป็นธรรมดา</button><div id="lineLinkCard" hidden></div></main>
<script>let active=true;window.DemoData={isConfigured:()=>true,promotion:async()=>({serverTime:new Date().toISOString(),linked:true,campaigns:[{id:'qa',title:'ทดสอบ',active,remaining:0,slots:[{date:'2099-01-05',start:'10:00:00',end:'12:30:00'},{date:'2099-01-05',start:'13:30:00',end:'16:00:00'}]}],codes:[],credits:[]})};document.getElementById('close-campaign').onclick=()=>{active=false;PromotionUI.refresh(true)};</script>
<script src="../../web/promotion-core.js"></script><script src="../../web/promotion-ui.js"></script></html>
