<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo promotion merchant QA</title><link rel="stylesheet" href="../../web/promotion.css"><style>body{font:16px system-ui;margin:0;background:#f1e9e2}main{max-width:850px;margin:auto;background:white;padding:20px;min-height:100vh}</style><div id="merchantApp"><main><h1>หลังบ้าน — ทดสอบเท่านั้น</h1><div class="promo"><button data-promo-checkout="fixture-booking">สรุปยอด / ทำเสร็จและชำระครบ</button></div></main></div><script>
